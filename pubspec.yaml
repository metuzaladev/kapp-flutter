name: kapp
description: "Käpp — dog park and dog care app. Flutter port of the TalTech ICD0018 React Native app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ^7.2.2
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^5.1.0
  geolocator: ^14.0.1
  go_router: ^18.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  socket_io_client: ^3.1.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  vector_map_tiles: ^9.0.0-beta.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/sample-dogs/
    - assets/i18n/
    - assets/data/

  # Figma Typography/*: Manrope for headings, DM Sans for text. Only the weights the design uses ship.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope_800ExtraBold.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_700Bold.ttf
          weight: 700
